<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MeshRescue Live</title><link rel="stylesheet" href="style.css"></head><body>
      <div class="mobile-frame">
        <div class="status-bar"><span>9:41</span><span>🔋</span></div>
        <div class="radar-container">
          <div class="radar">
            <div class="sweep"></div>
            <div class="node n1"></div>
            <div class="node n2"></div>
            <div class="node n3"></div>
          </div>
          <p class="radar-text">3 Nodes Connected</p>
        </div>
        <div class="sos-container">
          <button id="sos-btn">SOS</button>
          <p class="sos-desc">Broadcast emergency beacon to all nearby mesh nodes.</p>
        </div>
        <div id="overlay" class="overlay">
          <h1>BROADCASTING SOS</h1>
          <p>Location and medical profile transmitted to local mesh network.</p>
          <button id="cancel-btn">CANCEL BEACON</button>
        </div>
      </div>
      <script src="app.js"></script></body></html>
